[project]
name = "outreach"
version = "0.1.0"
requires-python = ">=3.11"
# Runtime dependencies (also what Vercel installs for the hosted function).
dependencies = [
  "httpx", "beautifulsoup4", "trafilatura", "feedparser", "pydantic", "PyYAML",
  "typer", "google-genai", "python-dotenv", "tldextract", "fastapi", "psycopg[binary]",
]

[project.optional-dependencies]
local = ["uvicorn[standard]"]   # run the UI locally: pip install -e ".[local,dev]"
dev = ["pytest"]

[project.scripts]
outreach = "outreach.cli:app"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
