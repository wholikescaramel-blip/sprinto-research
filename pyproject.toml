[project]
name = "outreach"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "httpx", "beautifulsoup4", "trafilatura", "feedparser", "pydantic", "PyYAML",
  "typer", "pytest", "google-genai", "python-dotenv", "tldextract",
]

[project.scripts]
outreach = "outreach.cli:app"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
